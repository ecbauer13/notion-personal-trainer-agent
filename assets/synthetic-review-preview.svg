<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1040" viewBox="0 0 1100 1040"><rect width="1100" height="1040" rx="24" fill="#FFFBFD"/><g font-family="Arial, Helvetica, sans-serif"><text x="80" y="67" font-size="16" fill="#994569" font-weight="700">NOTION PERSONAL TRAINER AGENT</text><text x="80" y="119" font-size="38" fill="#263F62" font-weight="700">Weekly Fitness Review</text><text x="80" y="157" font-size="18" fill="#334766" font-weight="400">Synthetic example · Notion output illustration</text><rect x="80" y="192" width="458" height="160" rx="18" fill="#EAF2FE" stroke="#BCD1EF"/><text x="106" y="227" font-size="21" fill="#355985" font-weight="600">Training days</text><text x="106" y="288" font-size="48" fill="#355985" font-weight="700">2</text><text x="106" y="326" font-size="17" fill="#334766" font-weight="400">Latest week</text><rect x="562" y="192" width="458" height="160" rx="18" fill="#EAF2FE" stroke="#BCD1EF"/><text x="588" y="227" font-size="21" fill="#355985" font-weight="600">Active weeks</text><text x="588" y="288" font-size="48" fill="#355985" font-weight="700">4 / 4</text><text x="588" y="326" font-size="17" fill="#334766" font-weight="400">Latest four weeks</text><rect x="80" y="376" width="458" height="160" rx="18" fill="#FBEAF1" stroke="#E8BDD0"/><text x="106" y="411" font-size="21" fill="#994569" font-weight="600">Exercises progressed</text><text x="106" y="472" font-size="48" fill="#994569" font-weight="700">2 / 2</text><text x="106" y="510" font-size="17" fill="#334766" font-weight="400">Comparable exercise groups</text><rect x="562" y="376" width="458" height="160" rx="18" fill="#FBEAF1" stroke="#E8BDD0"/><text x="588" y="411" font-size="21" fill="#994569" font-weight="600">Recorded rep bests</text><text x="588" y="472" font-size="48" fill="#994569" font-weight="700">2</text><text x="588" y="510" font-size="17" fill="#334766" font-weight="400">Same load and set context</text><text x="80" y="594" font-size="25" fill="#355985" font-weight="700">Concise Summary</text><text x="96" y="632" font-size="19" fill="#334766" font-weight="400">• Recorded training showed progress across both evaluated movements.</text><text x="80" y="689" font-size="25" fill="#355985" font-weight="700">Coaching Analysis</text><text x="96" y="727" font-size="20" fill="#994569" font-weight="700">• Leg press</text><text x="116" y="755" font-size="19" fill="#334766" font-weight="400">Latest and four-week comparisons showed progress.</text><text x="116" y="783" font-size="19" fill="#334766" font-weight="400">Recorded sessions also show repeated progress across 12 weeks.</text><text x="96" y="825" font-size="20" fill="#994569" font-weight="700">• Cable row</text><text x="116" y="853" font-size="19" fill="#334766" font-weight="400">Latest improvement supported by a four-week pattern of progress.</text><text x="96" y="895" font-size="20" fill="#994569" font-weight="700">• Body weight</text><text x="116" y="923" font-size="19" fill="#334766" font-weight="400">Weight stayed consistent; longer weight evidence is insufficient.</text><text x="80" y="995" font-size="16" fill="#667690" font-weight="400">Invented records · Calculated metrics · Illustrative narrative</text></g></svg>